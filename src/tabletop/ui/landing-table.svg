      <text x="99" y="286" font-size="17" font-weight="700">งานบนโต๊ะของเรา</text>
      <circle cx="451" cy="280" r="3" fill="#667268"/>
      <text x="67" y="339" font-size="12" fill="#667268">สิ่งที่อยากทำให้สำเร็จ</text>
      <text x="363" y="339" font-size="12" fill="#667268">สถานะ</text>
      <path fill="none" d="M64 354h400M64 409h400M64 464h400" stroke="#eeeee2"/>
      <circle cx="76" cy="382" r="9" fill="#e8f0e4"/>
      <path fill="none" d="m72 382 3 3 5-6" stroke="#356e5d" stroke-width="1.7" stroke-linecap="round"/>
