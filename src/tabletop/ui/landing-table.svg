<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" fill="none">
  <title>A table taking shape around a team's work</title>
  <desc>Concept illustration: a request to track work becomes a task list, a summary, and an action on one shared table. All content is fictional.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d9d4c4"/></pattern>
    <filter id="paper" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#d9d4c4" flood-opacity=".5"/><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#303d3a" flood-opacity=".06"/></filter>
  </defs>
  <rect x="6" y="6" width="788" height="638" rx="36" fill="#eeeee2"/>
  <rect x="6" y="6" width="788" height="638" rx="36" fill="url(#dots)"/>
  <g font-family="Manrope, Noto Sans Thai, sans-serif" fill="#303d3a">
    <circle cx="42" cy="42" r="5" fill="#356e5d"/>
    <text x="58" y="48" font-size="14" font-weight="600">A little idea. A useful table.</text>
    <g filter="url(#paper)">
      <rect x="54" y="83" width="546" height="91" rx="22" fill="#fffdf7" stroke="#d9d4c4"/>
