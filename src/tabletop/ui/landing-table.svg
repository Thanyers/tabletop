      <text x="114" y="116" font-size="13" fill="#667268">เริ่มจากสิ่งที่อยากทำ</text>
      <text x="114" y="146" font-size="20" font-weight="600">“อยากเห็นว่างานไหนยังค้างอยู่”</text>
    </g>
    <path fill="none" d="M327 175v31c0 10-8 18-18 18H226v31M327 206h306c10 0 18 8 18 18v42" stroke="#356e5d" stroke-width="2" stroke-dasharray="5 7"/>
    <g filter="url(#paper)">
