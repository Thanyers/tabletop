      <text x="362" y="388" font-size="14" fill="#356e5d">เสร็จแล้ว</text>
      <circle cx="76" cy="437" r="9" fill="none" stroke="#d9d4c4" stroke-width="2"/>
      <text x="98" y="443" font-size="16">ลองวิธีใหม่</text>
      <text x="362" y="443" font-size="14" fill="#89632f">กำลังทำ</text>
      <circle cx="76" cy="492" r="9" fill="none" stroke="#d9d4c4" stroke-width="2"/>
