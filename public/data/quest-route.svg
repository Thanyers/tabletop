<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">สวนแห่งแสง - เส้นทางทดลองเล่น</title>
  <desc id="desc">A three-stop illustrated route from Garden Gate to Lantern Library to Treasure Grove, with synthetic playtest timings of 75, 220, and 480 seconds.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8ed"/><stop offset="1" stop-color="#edf4e8"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e4b34e"/><stop offset="1" stop-color="#d17d5d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#273b31" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1280" height="760" rx="34" fill="url(#paper)"/>
  <circle cx="1090" cy="95" r="175" fill="#e1ecd9" opacity=".58"/>
  <circle cx="170" cy="720" r="210" fill="#f2e7c5" opacity=".43"/>
  <path d="M0 166 C220 126 304 191 516 156 S884 109 1280 162" fill="none" stroke="#dfe8d5" stroke-width="2"/>
