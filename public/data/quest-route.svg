    <text x="98" y="568" font-size="22" font-weight="700" fill="#243c32">ด่านสวน</text>
    <text x="98" y="594" font-size="13" fill="#67776b">ผ่านโดยไม่ต้องใช้คำใบ้</text>
    <rect x="305" y="518" width="69" height="28" rx="14" fill="#edf5e9"/>
    <text x="339.5" y="537" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#52734c">75 sec</text>

    <text x="508" y="112" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6585ad">02  /  LANTERN LIBRARY</text>
    <text x="508" y="145" font-size="22" font-weight="700" fill="#243c32">ด่านห้องสมุด</text>
    <text x="508" y="171" font-size="13" fill="#67776b">ยังติดและอยากได้คำใบ้ทีละนิด</text>
    <rect x="715" y="95" width="69" height="28" rx="14" fill="#edf3fb"/>
    <text x="749.5" y="114" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#5879a2">220 sec</text>

