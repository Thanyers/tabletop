  <text x="72" y="116" font-family="Noto Sans Thai, Segoe UI, sans-serif" font-size="35" font-weight="700" fill="#243c32">สวนแห่งแสง</text>
  <text x="72" y="145" font-family="Noto Sans Thai, Segoe UI, sans-serif" font-size="16" fill="#65776d">เส้นทางทดลองเล่น 3 ด่าน · เวลาจากข้อมูลสังเคราะห์</text>
  <rect x="1007" y="65" width="202" height="43" rx="21.5" fill="#ffffff" stroke="#d6dfd1"/>
  <circle cx="1030" cy="86.5" r="6" fill="#d89c36"/>
  <text x="1046" y="91" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#556b5d">75s  →  220s  →  480s</text>
  <path d="M248 407 C390 390 470 302 632 302 C790 302 904 390 1035 407" fill="none" stroke="#fffdf6" stroke-width="28" stroke-linecap="round"/>
  <path d="M248 407 C390 390 470 302 632 302 C790 302 904 390 1035 407" fill="none" stroke="url(#path)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 17"/>
