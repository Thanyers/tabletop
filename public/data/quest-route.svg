  <text x="72" y="702" font-family="Noto Sans Thai, Segoe UI, sans-serif" font-size="12" fill="#7b887c">เวลาคือเวลาที่บันทึกไว้ในชุดตัวอย่าง ไม่ใช่เวลาวิเคราะห์จาก telemetry</text>
