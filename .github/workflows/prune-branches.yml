name: Prune merged branches

# CI010: deletes remote branches whose work is already in dev, so the branch list stays
# short without an admin turning on "Automatically delete head branches".
# Runs after every merge into dev (deletes the branch that was just merged) and once a day
# as a sweep. Run workflow with dry_run=true lists what it would delete without deleting.
#
# A branch is deleted only when ALL hold:
#   1. it is not main or dev
#   2. its tip is already in origin/dev (release/hotfix branches merged only into main
#      stay until main is merged back into dev)
#   3. no open pull request uses it as its head
#   4. a merged pull request used it as its head, or its tip commit is older than 3 days
#      (a branch just cut from dev and not yet committed to is never touched)
# Commits are never lost: every deleted tip is reachable from dev.

on:
  push:
    branches: [dev]
  schedule:
    - cron: "0 19 * * *" # 02:00 Asia/Bangkok
  workflow_dispatch:
    inputs:
      dry_run:
        description: List branches that would be deleted without deleting them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prune-branches
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # delete branches
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          MIN_AGE_DAYS: "3"
        run: |
          set -euo pipefail
          git fetch -q --prune origin '+refs/heads/*:refs/remotes/origin/*'
          open=$(gh pr list -R "$REPO" --state open --limit 1000 --json headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .headRefName')
          merged=$(gh pr list -R "$REPO" --state merged --limit 1000 --json headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .headRefName')
          cutoff=$(( $(date +%s) - MIN_AGE_DAYS * 86400 ))
          doomed=()
          kept=0
          while read -r ref; do
            b=${ref#refs/remotes/origin/}
            case "$b" in main|dev|HEAD) continue ;; esac
            if ! git merge-base --is-ancestor "$ref" origin/dev; then kept=$((kept + 1)); continue; fi
            if grep -qxF "$b" <<<"$open"; then echo "keep $b: open PR"; kept=$((kept + 1)); continue; fi
            if ! grep -qxF "$b" <<<"$merged" && [ "$(git log -1 --format=%ct "$ref")" -gt "$cutoff" ]; then
              echo "keep $b: no merged PR and tip newer than ${MIN_AGE_DAYS} days"; kept=$((kept + 1)); continue
            fi
            doomed+=("$b")
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          {
            echo "### Prune merged branches"
            echo "dry run: $DRY_RUN · delete: ${#doomed[@]} · keep: $kept"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ ${#doomed[@]} -eq 0 ]; then echo "nothing to delete"; exit 0; fi
          printf -- '- `%s`\n' "${doomed[@]}" >>"$GITHUB_STEP_SUMMARY"
          printf 'delete %s\n' "${doomed[@]}"
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          # Batches keep one push from carrying hundreds of refs.
          for ((i = 0; i < ${#doomed[@]}; i += 50)); do
            git push -q origin --delete "${doomed[@]:i:50}"
          done
          echo "deleted ${#doomed[@]} branch(es)"
