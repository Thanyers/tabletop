name: Validate local R1 candidate

on:
  pull_request:
  push:
    branches: [main, dev, feat/tabletop-r1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  # CD002: a run on dev may be deploying staging (D1 migrations included), so a newer merge
  # never cancels it; GitHub keeps only the newest pending run. Other refs still cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

env:
  BROWSER_CHANNEL: chromium
  TABLETOP_ENV: local

jobs:
  # Decides how much this run checks.
  # CI005: the slow browser suites run only for releases (PRs into main, pushes to main,
  # hotfixes) and on manual runs. PRs into dev run the fast checks.
  # CI007: a push to dev (a merged PR) also runs the browser suites. Rulesets only gate PRs,
  # so a red run here never blocks merging; it opens/updates a GitHub issue instead, so a
  # regression shows up the day it lands rather than on release day.
  # CI006: a release merge on main whose code is identical to its release PR head, which
  # already passed the full suite as a PR into main, reuses that result instead of running
  # everything again, so the deploy starts a few seconds after the merge.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # look up the release PR's earlier run
    outputs:
      full_suite: ${{ steps.plan.outputs.full_suite }}
      reuse: ${{ steps.plan.outputs.reuse }}
      worker_gate: ${{ steps.integration.outputs.worker }}
      ui_gate: ${{ steps.integration.outputs.ui }}
      compute_gate: ${{ steps.integration.outputs.compute }}
      compute_container_gate: ${{ steps.integration.outputs.compute_container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate planner must resolve both event SHAs and the PR's merge base.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Choose checks
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          full=false
          reuse=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$BASE_REF" = main ]; then
            full=true
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/dev ]; then
            full=true
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            full=true
            if git rev-parse -q --verify HEAD^2 >/dev/null \
              && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              head="$(git rev-parse HEAD^2)"
              # The merged PR into main whose head is exactly that commit (a run's own
              # pull_requests list is emptied once the PR merges, so ask from the commit side).
              branch="$(gh api "repos/$REPO/commits/$(git rev-parse HEAD)/pulls" \
                --jq "[.[] | select(.base.ref == \"main\" and .head.sha == \"$head\" and .merged_at != null)][0].head.ref // empty" || true)"
              run=""
              if [ -n "$branch" ]; then
                run="$(gh api "repos/$REPO/actions/workflows/validate.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=20" \
                  --jq "[.workflow_runs[] | select(.head_branch == \"$branch\")][0].html_url // empty" || true)"
              fi
              if [ -n "$run" ]; then
                full=false
                reuse=true
                echo "::notice::Same code as release PR head $head, which passed the full suite: $run"
              else
                echo "Merge tree matches $head but no passing full-suite PR run was found; running everything."
              fi
            else
              echo "The merge commit's code differs from its PR head; running everything."
            fi
          fi
          echo "full_suite=$full" >> "$GITHUB_OUTPUT"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          echo "full_suite=$full reuse=$reuse"
      - name: Select risk-targeted gates for PRs into dev
        id: integration
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/integration-gate-plan.mjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

  fast-checks:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Check publication paths and credential patterns
        run: node scripts/check-public-files.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check changelog fragments (CI008)
        run: npx tsx server/changelog.ts check
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Agent startup adapters and instruction budget
        run: npm run test:agents
      - name: Risk-targeted gate planner and Worker red proof
        run: node --test scripts/integration-gate-plan.test.mjs scripts/integration-gate-worker-startup.test.mjs
      - name: Unit and local SQL integration tests
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results/unit-report.json
      - name: Typecheck and build
        env:
          DEEPSEEK_KEY: tabletop-ci-secret-canary-for-build
        run: npm run build
      - name: Check server secret stays out of browser assets
        run: node scripts/check-client-secrets.mjs
      - name: Workers, D1 and Durable Object integration tests
        run: npm run test:cloudflare -- --reporter=default --reporter=json --outputFile=test-results/cloudflare-report.json
      - name: Bundle Cloudflare without publishing
        env:
          WRANGLER_SEND_METRICS: false
        run: npm run build:cloudflare
      - name: Isolated JavaScript and Python Container API integration
        if: needs.plan.outputs.full_suite == 'true'
        run: node scripts/compute-cloudflare-local.mjs
      - name: Controlled compute acceptance with disposable local authority
        if: needs.plan.outputs.full_suite == 'true'
        run: |
          docker build --tag tabletop-compute:1 compute
          node --import tsx scripts/compute-acceptance-local.mjs > test-results/compute-controlled.log 2>&1 || { tail -80 test-results/compute-controlled.log; exit 1; }
      - name: Browser suites skipped for this change
        if: needs.plan.outputs.full_suite != 'true'
        run: echo "::notice::Fast checks only. Browser suites run after the merge into dev, on the release PR into main, on main, or via Run workflow (workflow_dispatch)."
      - name: Retain test summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-summaries-fast
          path: |
            test-results/unit-report.json
            test-results/cloudflare-report.json
            test-results/compute-cloudflare/result.json
            test-results/compute-cloudflare/runtime.log
            test-results/post-deploy/compute-controlled-local/results.json
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: ignore

  worker-startup:
    name: Built Worker startup and health probes
    needs: [plan]
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && needs.plan.outputs.worker_gate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build local assets
        env:
          DEEPSEEK_KEY: tabletop-ci-secret-canary-for-build
        run: npm run build
      - name: Build the Worker artifact without publishing
        env:
          WRANGLER_SEND_METRICS: false
        run: npm run build:cloudflare
      - name: Start the built Worker with synthetic bindings
        run: node scripts/integration-gate-worker-startup.mjs

  focused-ui:
    name: F066 composer and reference-routing browser harness
    needs: [plan]
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && needs.plan.outputs.ui_gate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build the F066 browser harness
        run: node scripts/build-f066-rules-harness.mjs
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify composer references and routing
        run: node tests/ui/f066-rules-browser.mjs

  focused-compute:
    name: Focused compute tests
    needs: [plan]
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && needs.plan.outputs.compute_gate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Compute contracts and server orchestration tests
        run: >-
          npm test --
          src/tabletop/shared/table-compute.test.ts
          src/tabletop/shared/computed-formula.test.ts
          src/tabletop/shared/computed-columns.test.ts
          src/tabletop/domain/table-compute.test.ts
          src/tabletop/domain/table-computed.test.ts
          src/tabletop/domain/computed-projection.test.ts
          src/tabletop/ui/table-compute-ui.test.ts
          server/table-compute-orchestrator.test.ts
          server/compute-runner.test.ts
          server/compute-wire.test.ts
          server/compute-deploy-config.test.ts
      - name: Cloudflare compute runner tests
        run: npm run test:cloudflare -- cloudflare/compute-runner.test.ts
      - name: Workers Container API smoke for Docker image changes
        if: needs.plan.outputs.compute_container_gate == 'true'
        run: node scripts/compute-cloudflare-local.mjs

  # CI006: the browser suites run as parallel jobs next to the fast checks instead of one
  # after another. Each builds what its fixture serves (dist/, worker-build/).
  # CD002: they occasionally race layout/timers on the 2-core runner, so each retries once;
  # the first failure stays in the log and the job fails if both attempts fail.
  browser-node:
    name: Persona demos and local browser acceptance
    needs: plan
    if: needs.plan.outputs.full_suite == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build
        env:
          DEEPSEEK_KEY: tabletop-ci-secret-canary-for-build
        run: npm run build
      - name: Bundle Cloudflare without publishing
        # The persona demos serve worker-build/index.js through Miniflare.
        env:
          WRANGLER_SEND_METRICS: false
        run: npm run build:cloudflare
      - name: Install test browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Repeatable persona demos and replay report
        run: npm run demo:auto:run
      - name: Seven-session local browser acceptance
        if: ${{ !cancelled() }}
        run: npm run test:r1:browser || { echo "::warning::test:r1:browser failed; retrying once"; npm run test:r1:browser; }
      - name: Retain test summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-summaries-node
          path: |
            test-results/tabletop-r1/report.json
            test-results/tabletop-r1/failure-*.png
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: ignore
      - name: Retain sanitized auto-demo history
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-demo-history
          path: |
            test-results/auto-demo/**/run.json
            test-results/auto-demo/**/report.html
          retention-days: 30
          include-hidden-files: false
          if-no-files-found: ignore

  # CI009: the Workers suite was the slowest job (~8 min), so it runs as two parallel halves.
  # TT_WORKERS_PART picks the checks in tests/cloudflare-browser.mjs; each half starts its own
  # Miniflare, D1 and accounts. `needs.browser-workers.result` fails if either half fails.
  browser-workers:
    name: Account multiplayer and AI browser acceptance on Workers (${{ matrix.part }}/2)
    needs: plan
    if: needs.plan.outputs.full_suite == 'true'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build
        env:
          DEEPSEEK_KEY: tabletop-ci-secret-canary-for-build
        run: npm run build
      - name: Bundle Cloudflare without publishing
        env:
          WRANGLER_SEND_METRICS: false
        run: npm run build:cloudflare
      - name: Install test browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Account multiplayer and AI browser acceptance on Workers (${{ matrix.part }}/2)
        env:
          TT_WORKERS_PART: ${{ matrix.part }}
        run: npm run test:cloudflare:browser || { echo "::warning::test:cloudflare:browser part $TT_WORKERS_PART failed; retrying once"; npm run test:cloudflare:browser; }
      - name: Retain test summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-summaries-workers-${{ matrix.part }}
          path: |
            test-results/cloudflare-browser/report.json
            test-results/cloudflare-browser/public-demo-desktop.png
            test-results/cloudflare-browser/public-demo-narrow.png
            test-results/cloudflare-browser/public-welcome-desktop.png
            test-results/cloudflare-browser/public-welcome-narrow.png
            test-results/cloudflare-browser/interactive-demo-teaching.png
            test-results/cloudflare-browser/interactive-demo-encounter.png
            test-results/cloudflare-browser/interactive-demo-narrow.png
            test-results/cloudflare-browser/interactive-demo-manual-state.json
            test-results/cloudflare-browser/canvas-demo-empty.png
            test-results/cloudflare-browser/canvas-demo-dragged.png
            test-results/cloudflare-browser/canvas-demo-invoice.png
            test-results/cloudflare-browser/generic-table-*.png
            test-results/cloudflare-browser/failure-*.png
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: ignore

  browser-generated:
    name: Generated scenes, private trials and shared layout acceptance
    needs: plan
    if: needs.plan.outputs.full_suite == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build
        env:
          DEEPSEEK_KEY: tabletop-ci-secret-canary-for-build
        run: npm run build
      - name: Bundle Cloudflare without publishing
        env:
          WRANGLER_SEND_METRICS: false
        run: npm run build:cloudflare
      - name: Install test browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Generated scenes, private trials and shared layout acceptance
        run: npm run test:generative:browser || { echo "::warning::test:generative:browser failed; retrying once"; npm run test:generative:browser; }
      - name: Retain test summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-summaries-generated
          path: |
            test-results/generative-canvas/report.json
            test-results/generative-canvas/*.png
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: ignore

  # F080: the generated tool host is the isolation boundary for custom UI, so its browser proof
  # has to run in CI and not only on the author's machine.
  tool-host:
    name: Generated tool host and frame isolation
    needs: [plan]
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && needs.plan.outputs.ui_gate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Build the sandbox runtime and the host harness
        run: |
          node scripts/build-tool-sandbox-runtime.mjs
          node scripts/build-tool-host-harness.mjs
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify the host, the bridge and the frame isolation
        env:
          BROWSER_CHANNEL: chromium
        run: node tests/ui/tool-host/browser.mjs
      - name: Verify the authoring panel
        env:
          BROWSER_CHANNEL: chromium
        run: npm run test:tool-authoring:browser
      - name: Verify the room shell
        env:
          BROWSER_CHANNEL: chromium
        run: npm run test:room-shell:browser
      - name: Verify the joined data panel
        env:
          BROWSER_CHANNEL: chromium
        run: npm run test:tool-joined:browser
      - name: Retain host evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-host-evidence
          path: |
            test-results/tool-host/
            test-results/tool-authoring/
            test-results/tool-joined/
            test-results/room-shell/
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: ignore

  # The rulesets require a check named `local-validation` on main and dev, so this job keeps
  # the name and passes only when every job that ran passed (skipped jobs are fine).
  local-validation:
    needs: [plan, fast-checks, browser-node, browser-workers, browser-generated, worker-startup, focused-ui, focused-compute, tool-host]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job that ran to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$bad" ]; then echo "::error::Failed or cancelled: $bad"; exit 1; fi
          if [ "$(echo "$RESULTS" | jq -r '.plan.result')" != success ]; then echo "::error::plan did not run"; exit 1; fi

  # CI007: a failed browser run on dev (after a merge) is reported as an issue rather than
  # blocking anything. Cancelled runs are ignored: a newer merge into dev supersedes them.
  report-dev-failure:
    needs: [plan, fast-checks, browser-node, browser-workers, browser-generated]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the dev browser-suite issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          TITLE: "dev: browser suites failing after merge"
        run: |
          failed="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')"
          body="Failed after merge into \`dev\` at \`${SHA:0:7}\`: **$failed** — $RUN_URL
          Nothing was blocked (CI007). Fix on \`dev\` before the next release; the release PR runs the same suites."
          number="$(gh issue list -R "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$body"
          fi

  # CD004/CD005: a dev run whose full suite passed closes the issue earlier failures opened.
  # Separate from deploy-staging, which no longer waits for the browser suites.
  close-dev-failure:
    name: Close fixed dev browser-suite issue
    needs: [local-validation]
    # Explicit status evaluation avoids transitive skips from optional PR-only gates.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.local-validation.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Never fails the job.
      - name: Close dev browser-suite issues fixed by this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list -R "$REPO" --state open --author app/github-actions --search '"dev: browser suites failing after merge" in:title' --json number,title --jq '.[] | select(.title | startswith("dev: browser suites failing after merge")) | .number' 2>/dev/null); do
            gh issue close "$n" -R "$REPO" --comment "Fixed: the full suite passed after the merge of ${GITHUB_SHA:0:7} in $RUN_URL" || true
          done

  # CD002: a merge into dev deploys tabletop-staging. It lives here, not in a workflow_run
  # file, because workflow_run only fires for files on the default branch (main).
  # Production is deployed only by release-deploy.yml (CD001), gated by the release PR's full suite.
  # CD005: staging starts as soon as the fast checks pass; the browser suites keep running
  # alongside, and a failure there still fails local-validation and opens/comments the CI007
  # issue. Staging may briefly run code whose browser suites later fail.
  deploy-staging:
    name: Deploy tabletop-staging
    needs: [plan, fast-checks]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.fast-checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # room for one deploy retry after a slow container step
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write # open an issue when a staging deploy fails
    env:
      SHA: ${{ github.sha }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      STAGING_WORKER: ${{ vars.STAGING_WORKER || 'tabletop-staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Record start
        run: |
          echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "STAGE=prepare" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check deploy settings
        env:
          WRANGLER_CONFIG_STAGING: ${{ secrets.WRANGLER_CONFIG_STAGING }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WRANGLER_CONFIG_STAGING STAGING_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repo secrets/variables:$missing"; exit 1; fi
          umask 077
          printf '%s' "$WRANGLER_CONFIG_STAGING" > wrangler.staging.json
          npx tsx server/release-deploy.ts check-config wrangler.staging.json "$STAGING_WORKER" "$STAGING_URL"
          npx tsx server/compute-deploy-config.ts wrangler.staging.json
          npx tsx server/release-deploy.ts check-config wrangler.staging.json "$STAGING_WORKER" "$STAGING_URL"
      - name: Build
        run: |
          npm run build
          echo "VERSION=$(node -p "require('./dist/version.json').version")" >> "$GITHUB_ENV"
          node -e "console.log(require('./dist/version.json'))"
      - name: Staging — migrations
        run: |
          echo "STAGE=staging-migrations" >> "$GITHUB_ENV"
          bash .github/scripts/d1-migrate.sh wrangler.staging.json staging
      - name: Staging — deploy
        run: |
          echo "STAGE=staging-deploy" >> "$GITHUB_ENV"
          bash .github/scripts/wrangler-deploy-retry.sh wrangler.staging.json
      - name: Staging — smoke checks
        run: |
          echo "STAGE=staging-smoke" >> "$GITHUB_ENV"
          npx tsx server/release-deploy.ts smoke "$STAGING_URL" "$VERSION" "$SHA" --compute | tee -a "$GITHUB_STEP_SUMMARY"
          echo "STAGE=done" >> "$GITHUB_ENV"
          echo "Deployed dev $SHA ($VERSION) to staging." >> "$GITHUB_STEP_SUMMARY"
      # CD004: a later success closes the issues earlier failures opened; never fails the job.
      - name: Close staging-failure issues fixed by this run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list -R "$REPO" --state open --author app/github-actions --search '"Staging deploy failed" in:title' --json number,title --jq '.[] | select(.title | startswith("Staging deploy failed")) | .number' 2>/dev/null); do
            gh issue close "$n" -R "$REPO" --comment "Fixed: staging deployed and passed smoke checks at ${SHA:0:7} in $RUN_URL" || true
          done
      - name: Remove deploy config
        if: always()
        run: rm -f wrangler.staging.json
      # The failure logger must never change the deploy's outcome.
      - name: Open staging-failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DETECTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(printf '%s\n' \
            "Staging deploy failed. Staging is NOT rolled back automatically; production is untouched." \
            "" \
            "| Field | Value |" "| --- | --- |" \
            "| Commit (dev) | $SHA |" \
            "| Failed stage | ${STAGE:-unknown} |" \
            "| job_started_at | $JOB_STARTED_AT |" \
            "| detected_at | $DETECTED_AT |" \
            "| Triggered by | ${{ github.actor }} |" \
            "| Run | $RUN_URL |" \
            "" \
            "Next: read the run log, then fix on dev (the next merge redeploys) or re-run the failed job." \
            "Record the failure and fix times in MEMORY.md → Deploy failures.")"
          gh issue create --title "Staging deploy failed at ${STAGE:-unknown} (${SHA:0:7})" --body "$BODY" \
            || echo "Could not open the failure issue; the run log still has the details."
